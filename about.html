<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-primary text-white">

    <div class="container mt-5">

        <h1 class="mb-4">Tell Us About Yourself</h1>
    
        <form>
    
            <div>
                <label for="name" class="form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control mb-4"
                    id="name"
                    name="name"
                    placeholder="Enter your full name">
    


                <label for="weight" class="form-label">Enter Weight (LBS)</label>
                <input
                    type="text"
                    class="form-control mb-4"
                    id="weight"
                    name="weight"
                    placeholder="Enter your weight in pounds">
    


                <label for="height" class="form-label">Enter your height(CM)</label>
                <input
                    type="text"
                    class="form-control mb-4"
                    id="height"
                    name="height"
                    placeholder="Enter your height(CM)">
                    
                
                    

                <label for="age" class="form-label">Enter your age</label>
                <input
                    type="text"
                    class="form-control mb-4"
                    id="age"
                    name="age"
                    placeholder="Enter your age"> 



                <label for="age" class="form-label">Enter your gender</label>
                <select id="gender" name="gender">
                    <option value="boy">Boy</option>
                    <option value="girl">Girl</option>
                </select>
            </div>
    
        </form>
    
    </div>
        



    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
